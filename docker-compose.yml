services:
  whisper:
    build:
      context: ./whisper-package
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  llm:
    build:
      context: ./llm-package
      dockerfile: Dockerfile
    volumes:
      - ./llm-package/models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - internal

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - WHISPER_HOST=whisper
      - WHISPER_PORT=8080
      - LLM_HOST=llm
      - LLM_PORT=8081
      - LLM_MAX_RETRIES=3
      - GOOGLE_SHEET_ENABLED=false
      - GOOGLE_SHEET_TAB=Sheet1
      - GOOGLE_SHEET_MAX_RETRIES=3
      # Google Sheets export (optional). To enable: save your service account
      # JSON key as ./secrets/service-account.json (gitignored), share your
      # sheet with the service account email as Editor, then uncomment:
      # - GOOGLE_SHEET_ENABLED=true
      # - GOOGLE_SHEET_KEY_FILE=/run/secrets/service-account.json
      # - GOOGLE_SHEET_ID=<spreadsheet-id-from-url>
      #   and add the mount (under the service, same indentation as environment):
      #   volumes:
      #     - ./secrets/service-account.json:/run/secrets/service-account.json:ro
      - MAX_FILE_SIZE_MB=25
      - RATE_LIMIT_PER_IP=30
      - NUM_WORKERS=1
      - MAX_QUEUE_SIZE=50
      - WHISPER_TIMEOUT_SEC=600
      - WRITE_TIMEOUT_SEC=30
    depends_on:
      whisper:
        condition: service_healthy
      llm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:
    driver: bridge
